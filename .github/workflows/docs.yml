# Docs — build the VitePress site in docs/ and the web renderer in renderers/web, and
# deploy both to GitHub Pages (the renderer under /ui/) on every push to main that
# touches either. Pull requests build them in ci.yml (no deploy).
# Requires Settings → Pages → Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - renderers/web/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads each page's git history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install docs dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run docs:build

      - name: Install web renderer dependencies
        working-directory: renderers/web
        run: bun install --frozen-lockfile

      - name: Build the web renderer
        working-directory: renderers/web
        run: bun run build

      # The renderer is hosted at <site>/ui/ and talks A2A to the harness URL the user
      # enters (its assets resolve relatively, so the path needs no build-time base).
      - name: Place the web renderer under /ui
        working-directory: .
        run: cp -r renderers/web/dist docs/.vitepress/dist/ui

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
