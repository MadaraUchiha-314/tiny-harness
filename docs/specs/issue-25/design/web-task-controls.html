<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web task controls</title>
<style>
/* Design plan (issue-25) — extends issue-3's web renderer mock. New: header carries the
   state badge, the status-extension sub-state badge, a primary "Complete" and a ghost
   "Cancel task" (both disabled once terminal), and "← Parent" on a sub-task; the composer
   opens a command listbox (WAI-ARIA combobox) when the text starts with "/"; sub-tasks
   in the Task pane are links that open the sub-task (?task=<id>).
   Try: type "/", arrow keys + Enter, "/sub-task Draft the reply", open it, ← Parent, Complete. */
:root {
  --bg: #f6f7f4; --panel: #ffffff; --fg: #1c2420; --muted: #66706a; --rule: #d8ddd6;
  --accent: #1d6b5a; --accent-ink: #ffffff; --soft: #e4efe9;
  --warn: #8a5a00; --warn-bg: #fff4d6; --ok: #1d6b5a; --err: #a33a2a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141817; --panel: #1c2120; --fg: #e5e8e4; --muted: #98a39d; --rule: #2d3532;
  --accent: #6cc6a6; --accent-ink: #0f1a16; --soft: #1f2d28;
  --warn: #ffd27a; --warn-bg: #3a2e12; --ok: #6cc6a6; --err: #ff8c7a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141817; --panel: #1c2120; --fg: #e5e8e4; --muted: #98a39d; --rule: #2d3532;
  --accent: #6cc6a6; --accent-ink: #0f1a16; --soft: #1f2d28;
  --warn: #ffd27a; --warn-bg: #3a2e12; --ok: #6cc6a6; --err: #ff8c7a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: center; padding: .6rem 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
.pill { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; padding: .15rem .55rem; border-radius: 999px; background: var(--soft); color: var(--fg); white-space: nowrap; }
.pill.state-working { color: var(--ok); }
.pill.state-input { background: var(--warn-bg); color: var(--warn); }
.pill.state-done { background: var(--accent); color: var(--accent-ink); }
.pill.state-canceled { background: var(--rule); color: var(--muted); }
.pill.sub { background: none; border: 1px solid var(--rule); color: var(--muted); text-transform: none; letter-spacing: 0; }
.spacer { flex: 1; }
.actions { display: inline-flex; gap: .5rem; }
.mono { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.btn { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 8px; padding: .35rem .8rem; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; }
.btn.ghost { background: none; color: var(--fg); border-color: var(--rule); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
button:focus-visible, textarea:focus-visible, [role="option"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); min-height: 0; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: auto auto; } }
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stream { flex: 1; overflow-y: auto; padding: 1rem 16px; display: flex; flex-direction: column; gap: .75rem; min-height: 280px; }
.ev { max-width: 72ch; min-width: 0; white-space: pre-wrap; }
.ev.user { align-self: flex-end; background: var(--soft); border-radius: 12px 12px 2px 12px; padding: .5rem .8rem; }
.ev.agent { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px 12px 12px 2px; padding: .6rem .9rem; }
.ev.cmd { border-left: 3px solid var(--accent); padding: .3rem .7rem; font-family: var(--mono); font-size: .85rem; color: var(--muted); }
.ev .who { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .2rem; font-family: var(--sans); }
.status { font-size: .85rem; color: var(--muted); }
.composer { position: relative; display: flex; gap: .5rem; padding: .6rem 16px; border-top: 1px solid var(--rule); background: var(--panel); }
.composer textarea { flex: 1; min-width: 0; resize: none; font: inherit; padding: .5rem .7rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--fg); }
.lb { position: absolute; left: 16px; right: 16px; bottom: calc(100% - .2rem); margin: 0; padding: .3rem; list-style: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); }
.lb li { display: grid; grid-template-columns: minmax(7rem, auto) 1fr; gap: .2rem .8rem; padding: .35rem .6rem; border-radius: 6px; cursor: pointer; }
.lb li[aria-selected="true"] { background: var(--soft); }
.lb .n { font-family: var(--mono); font-size: .85rem; }
.lb .d { color: var(--muted); font-size: .85rem; }
aside { border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto; min-width: 0; }
@media (max-width: 820px) { aside { border-left: 0; border-top: 1px solid var(--rule); } }
.panel { padding: .9rem 16px; display: flex; flex-direction: column; gap: .8rem; }
.panel h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .3rem; }
.panel p { margin: 0; }
.subs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .35rem; }
.subs li { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
dl { display: grid; grid-template-columns: auto 1fr; gap: .15rem .8rem; margin: 0; font-size: .9rem; }
dt { color: var(--muted); }
dd { margin: 0; font-family: var(--mono); font-size: .85rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>tiny-harness</h1>
    <button class="link" id="parent" hidden>← Parent</button>
    <span class="mono" id="tid">task 7f3a…c21e</span>
    <span class="pill state-input" id="taskState" data-testid="state">INPUT_REQUIRED</span>
    <span class="pill sub" id="subState" data-testid="sub-state">awaiting next message</span>
    <span class="spacer"></span>
    <span class="actions" role="group" aria-label="Task controls"><button class="btn" id="complete">Complete</button><button class="btn ghost" id="cancel">Cancel task</button></span>
  </header>
  <main>
    <section class="conv" aria-label="Conversation">
      <div class="stream" id="stream" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <label for="reply" hidden>Message or /command</label>
        <textarea id="reply" rows="2" placeholder="Message, or / for commands" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cmds"></textarea>
        <ul class="lb" id="cmds" role="listbox" aria-label="Commands" hidden></ul>
        <button class="btn" type="submit">Send</button>
      </form>
    </section>
    <aside aria-label="Task">
      <div class="panel">
        <div><h2>Goal</h2><p id="goal"></p></div>
        <div><h2>Settings</h2><dl><dt>Model</dt><dd id="model">gpt-6.1-sol</dd><dt>Effort</dt><dd id="effort">provider default</dd></dl></div>
        <div><h2>Sub-tasks</h2><ul class="subs" id="subs"><li class="mono" id="nosubs">none</li></ul></div>
      </div>
    </aside>
  </main>
</div>
<script>
(function () {
  var m = /[?&]theme=(light|dark)/.exec(location.search); if (m) document.documentElement.setAttribute('data-theme', m[1]);
  var COMMANDS = [
    ['model', '[name]', 'Show or switch the model for this task'],
    ['effort', '[low|medium|high]', 'Show or set reasoning effort'],
    ['status', '', 'State, settings, plan and sub-tasks'],
    ['sub-task', '<description>', 'Split off a sub-task of this task']
  ];
  var ROOT = '7f3a…c21e', n = 0;
  var tasks = {}; tasks[ROOT] = { state: 'INPUT_REQUIRED', sub: 'awaiting-next-message', goal: 'Summarise the open support tickets and suggest owners.', parent: null, effort: 'provider default', evs: [
    ['user', 'You · reporter', 'Summarise the three open support tickets and suggest who should take each.'],
    ['agent', 'Agent · message', '#48213 (damaged blender): billing — refund needs a photo.\n#48377 (address change): logistics.\n#48402 (login loop): platform on-call.'],
    ['agent status', 'Status', 'INPUT_REQUIRED · awaiting next message — your turn']
  ] };
  var curId = ROOT;
  var ta = document.getElementById('reply'), lb = document.getElementById('cmds'), sel = 0, shown = [];
  function cur() { return tasks[curId]; }
  function terminal() { return cur().state === 'COMPLETED' || cur().state === 'CANCELED'; }
  function render() {
    var t = cur();
    document.getElementById('tid').textContent = 'task ' + curId;
    var st = document.getElementById('taskState'); st.textContent = t.state;
    st.className = 'pill ' + ({ COMPLETED: 'state-done', CANCELED: 'state-canceled', WORKING: 'state-working' }[t.state] || 'state-input');
    var sub = document.getElementById('subState'); sub.hidden = !(t.state === 'INPUT_REQUIRED' && t.sub); sub.textContent = (t.sub || '').replace(/-/g, ' ');
    document.getElementById('complete').disabled = terminal();
    document.getElementById('cancel').disabled = terminal();
    document.getElementById('parent').hidden = !t.parent;
    document.getElementById('goal').textContent = t.goal;
    document.getElementById('effort').textContent = t.effort;
    var s = document.getElementById('stream'); s.innerHTML = '';
    t.evs.forEach(function (e) {
      var d = document.createElement('div'); d.className = 'ev ' + e[0];
      var w = document.createElement('div'); w.className = 'who'; w.textContent = e[1];
      d.appendChild(w); d.appendChild(document.createTextNode(e[2])); s.appendChild(d);
    });
    s.scrollTop = s.scrollHeight;
    var ul = document.getElementById('subs'); ul.innerHTML = '';
    var kids = Object.keys(tasks).filter(function (k) { return tasks[k].parent === curId; });
    if (!kids.length) { var li = document.createElement('li'); li.className = 'mono'; li.textContent = 'none'; ul.appendChild(li); }
    kids.forEach(function (k) {
      var li = document.createElement('li'); var a = document.createElement('button'); a.className = 'link'; a.textContent = k;
      a.addEventListener('click', function () { curId = k; render(); });
      var meta = document.createElement('span'); meta.className = 'mono'; meta.textContent = tasks[k].state + ' · ' + tasks[k].goal;
      li.appendChild(a); li.appendChild(meta); ul.appendChild(li);
    });
  }
  function push(cls, who, text) { cur().evs.push([cls, who, text]); render(); }
  function openList() {
    var v = ta.value; var q = v.slice(1);
    shown = (v[0] === '/' && v.indexOf(' ') < 0) ? COMMANDS.filter(function (c) { return c[0].indexOf(q) === 0; }) : [];
    lb.innerHTML = ''; lb.hidden = !shown.length; ta.setAttribute('aria-expanded', shown.length ? 'true' : 'false');
    if (sel >= shown.length) sel = 0;
    shown.forEach(function (c, i) {
      var li = document.createElement('li'); li.id = 'cmd-' + c[0]; li.setAttribute('role', 'option'); li.setAttribute('aria-selected', i === sel ? 'true' : 'false');
      li.innerHTML = '<span class="n"></span><span class="d"></span>';
      li.querySelector('.n').textContent = '/' + c[0] + (c[1] ? ' ' + c[1] : '');
      li.querySelector('.d').textContent = c[2];
      li.addEventListener('mousedown', function (e) { e.preventDefault(); accept(i); });
      lb.appendChild(li);
    });
    if (shown.length) ta.setAttribute('aria-activedescendant', 'cmd-' + shown[sel][0]); else ta.removeAttribute('aria-activedescendant');
  }
  function accept(i) { ta.value = '/' + shown[i][0] + ' '; sel = 0; openList(); ta.focus(); }
  ta.addEventListener('input', function () { sel = 0; openList(); });
  ta.addEventListener('keydown', function (e) {
    if (!lb.hidden) {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % shown.length; openList(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + shown.length) % shown.length; openList(); return; }
      if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); accept(sel); return; }
      if (e.key === 'Escape') { e.preventDefault(); shown = []; lb.hidden = true; ta.setAttribute('aria-expanded', 'false'); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('composer').requestSubmit(); }
  });
  document.getElementById('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = ta.value.trim(); ta.value = ''; openList();
    if (!v || terminal()) return;
    push('user', 'You', v);
    var mm = /^\/([a-z][a-z0-9-]*)\s*([\s\S]*)$/.exec(v);
    if (mm && mm[1] === 'sub-task') {
      if (!mm[2]) { push('agent cmd', '/sub-task', 'Usage: /sub-task <description>'); return; }
      var id = curId + '.' + (++n);
      tasks[id] = { state: 'INPUT_REQUIRED', sub: 'awaiting-next-message', goal: mm[2], parent: curId, effort: cur().effort, evs: [['agent status', 'Status', 'Sub-task of ' + curId + ' · waiting for your first message']] };
      push('agent cmd', '/sub-task', 'Created sub-task ' + id + '. Open it from the Task pane.');
    } else if (mm && mm[1] === 'effort') {
      if (['low', 'medium', 'high'].indexOf(mm[2]) < 0) { push('agent cmd', '/effort', 'Effort: ' + cur().effort + '. Accepted: low, medium, high.'); return; }
      cur().effort = mm[2]; push('agent cmd', '/effort', 'Effort set to ' + mm[2] + ' for this task.');
    } else if (mm && mm[1] === 'model') {
      push('agent cmd', '/model', 'Model: gpt-6.1-sol. Selectable: gpt-6.1-sol, gpt-6-astra, gpt-6-luna.');
    } else if (mm && mm[1] === 'status') {
      push('agent cmd', '/status', curId + ' · ' + cur().state + (cur().sub ? ' (' + cur().sub + ')' : '') + '\nmodel gpt-6.1-sol · effort ' + cur().effort + ' · plan 0/0');
    } else {
      cur().state = 'WORKING'; cur().sub = null; render();
      setTimeout(function () { cur().state = 'INPUT_REQUIRED'; cur().sub = 'awaiting-next-message'; push('agent', 'Agent · message', 'Noted.'); }, 400);
    }
  });
  document.getElementById('complete').addEventListener('click', function () { cur().state = 'COMPLETED'; cur().sub = null; push('agent status', 'Status', 'Completed by you → COMPLETED'); });
  document.getElementById('cancel').addEventListener('click', function () { cur().state = 'CANCELED'; cur().sub = null; push('agent status', 'Status', 'Canceled by you → CANCELED'); });
  document.getElementById('parent').addEventListener('click', function () { curId = cur().parent; render(); });
  render();
})();
</script>
</body>
</html>
