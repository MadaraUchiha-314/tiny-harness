<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web multi-modal</title>
<style>
/* Design plan (issue-38) — extends issue-25's web renderer mock (same tokens).
   New: composer gets an attach button (+ drop, paste), attachment chips, a hold-to-talk
   mic button and a spoken-replies toggle; the stream shows images and audio in turns, a
   transcript under a voice turn, a "speaking" marker with Stop, and the agent's image.
   Try: Attach → Send; hold the mic (or press Space/Enter on it) → release; Stop; the
   "Too large" button shows the rejection state. ?theme=dark|light forces a theme. */
:root {
  --bg: #f6f7f4; --panel: #ffffff; --fg: #1c2420; --muted: #66706a; --rule: #d8ddd6;
  --accent: #1d6b5a; --accent-ink: #ffffff; --soft: #e4efe9;
  --warn: #8a5a00; --warn-bg: #fff4d6; --ok: #1d6b5a; --err: #a33a2a; --err-bg: #fbe9e6;
  --photo-a: #c9b79c; --photo-b: #7d8f86; --photo-c: #e9e2d4;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141817; --panel: #1c2120; --fg: #e5e8e4; --muted: #98a39d; --rule: #2d3532;
  --accent: #6cc6a6; --accent-ink: #0f1a16; --soft: #1f2d28;
  --warn: #ffd27a; --warn-bg: #3a2e12; --ok: #6cc6a6; --err: #ff8c7a; --err-bg: #3a1f1a;
  --photo-a: #8a7a62; --photo-b: #4c5a53; --photo-c: #a39b8c; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141817; --panel: #1c2120; --fg: #e5e8e4; --muted: #98a39d; --rule: #2d3532;
  --accent: #6cc6a6; --accent-ink: #0f1a16; --soft: #1f2d28;
  --warn: #ffd27a; --warn-bg: #3a2e12; --ok: #6cc6a6; --err: #ff8c7a; --err-bg: #3a1f1a;
  --photo-a: #8a7a62; --photo-b: #4c5a53; --photo-c: #a39b8c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; flex-wrap: wrap; gap: .5rem .75rem; align-items: center; padding: .6rem 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
.pill { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; padding: .15rem .55rem; border-radius: 999px; background: var(--warn-bg); color: var(--warn); white-space: nowrap; }
.pill.working { background: var(--soft); color: var(--ok); }
.spacer { flex: 1; }
.mono { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.btn { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 8px; padding: .35rem .8rem; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; }
.btn.ghost { background: none; color: var(--fg); border-color: var(--rule); font-weight: 500; }
.icon { width: 2.4rem; height: 2.4rem; padding: 0; display: inline-grid; place-items: center; flex: none; }
.icon svg { width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mic[aria-pressed="true"] { background: var(--err); border-color: var(--err); color: #fff; box-shadow: 0 0 0 0 var(--err); animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--err) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
@media (prefers-reduced-motion: reduce) { .mic[aria-pressed="true"] { animation: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--err) 35%, transparent); } }
.spk[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); min-height: 0; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { display: none; } }
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stream { flex: 1; overflow-y: auto; padding: 1rem 16px; display: flex; flex-direction: column; gap: .75rem; min-height: 300px; }
.ev { max-width: 72ch; min-width: 0; white-space: pre-wrap; }
.ev.user { align-self: flex-end; background: var(--soft); border-radius: 12px 12px 2px 12px; padding: .5rem .8rem; }
.ev.agent { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px 12px 12px 2px; padding: .6rem .9rem; }
.ev .who { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .2rem; }
.status { font-size: .85rem; color: var(--muted); }
.status.err { color: var(--err); background: var(--err-bg); padding: .35rem .6rem; border-radius: 6px; align-self: stretch; }
.photo { display: block; width: min(320px, 100%); aspect-ratio: 4 / 3; border-radius: 8px; margin: .35rem 0; border: 1px solid var(--rule); cursor: zoom-in;
  background: linear-gradient(180deg, var(--photo-c) 0 55%, var(--photo-a) 55% 100%); position: relative; overflow: hidden; }
.photo::before { content: ""; position: absolute; left: 14%; right: 30%; bottom: 18%; height: 26%; background: var(--photo-b); border-radius: 10px 10px 4px 4px; }
.photo.green::before { background: #3f8a4e; }
.photo::after { content: ""; position: absolute; right: 12%; top: 16%; width: 18%; height: 30%; border: 3px solid var(--photo-b); border-radius: 4px; }
.cap { font-size: .78rem; color: var(--muted); }
.audio { display: flex; gap: .5rem; align-items: center; margin: .2rem 0; flex-wrap: wrap; }
.wave { display: inline-flex; gap: 2px; align-items: center; height: 1.4rem; }
.wave i { width: 3px; background: var(--muted); border-radius: 2px; }
.transcript { margin-top: .35rem; padding-left: .6rem; border-left: 2px solid var(--rule); color: var(--fg); font-style: italic; }
.speaking { display: inline-flex; gap: .5rem; align-items: center; font-size: .82rem; color: var(--accent); margin-top: .4rem; }
.speaking .wave i { background: var(--accent); }
.composer { display: flex; flex-direction: column; gap: .45rem; padding: .6rem 16px; border-top: 1px solid var(--rule); background: var(--panel); }
.composer.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
.row { display: flex; gap: .5rem; align-items: flex-end; }
.row textarea { flex: 1; min-width: 0; resize: none; font: inherit; padding: .5rem .7rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--fg); }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip { display: inline-flex; gap: .45rem; align-items: center; border: 1px solid var(--rule); border-radius: 8px; padding: .2rem .25rem .2rem .3rem; font-size: .82rem; background: var(--bg); max-width: 100%; }
.chip .thumb { width: 2rem; height: 1.5rem; border-radius: 4px; background: linear-gradient(180deg, var(--photo-c) 0 55%, var(--photo-a) 55%); }
.chip button { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 0 .3rem; }
.rec { display: flex; gap: .6rem; align-items: center; font-size: .85rem; color: var(--err); }
.meter { flex: 1; max-width: 220px; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.meter b { display: block; height: 100%; width: 40%; background: var(--err); transition: width .1s; }
aside { border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto; min-width: 0; }
.panel { padding: .9rem 16px; display: flex; flex-direction: column; gap: .8rem; }
.panel h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .3rem; }
dl { display: grid; grid-template-columns: auto 1fr; gap: .15rem .8rem; margin: 0; font-size: .9rem; }
dt { color: var(--muted); } dd { margin: 0; font-family: var(--mono); font-size: .82rem; }
dialog { border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); color: var(--fg); padding: .8rem; max-width: min(90vw, 760px); }
dialog .photo { width: min(720px, 80vw); cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>tiny-harness</h1>
    <span class="mono">task 9c41…e07b</span>
    <span class="pill" id="state">INPUT_REQUIRED</span>
    <span class="spacer"></span>
    <button class="btn ghost" id="toolarge" type="button">Show: too large</button>
  </header>
  <main>
    <section class="conv" aria-label="Conversation">
      <div class="stream" id="stream" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="chips" id="chips" aria-label="Attachments"></div>
        <div class="rec" id="rec" hidden><span>● Recording</span><span class="meter"><b id="lvl"></b></span><span class="mono" id="secs">0:00</span><span class="cap">release to send</span></div>
        <div class="row">
          <button class="btn ghost icon" type="button" id="attach" aria-label="Attach image or audio"><svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10.5 18a2 2 0 0 1-3-3l7.5-7.5"/></svg></button>
          <label for="reply" class="sr">Message</label>
          <textarea id="reply" rows="2" placeholder="Message, /attach, or drop a file"></textarea>
          <button class="btn ghost icon spk" type="button" id="spk" aria-pressed="true" aria-label="Spoken replies" title="Spoken replies: on"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
          <button class="btn icon mic" type="button" id="mic" aria-pressed="false" aria-label="Hold to talk" title="Hold to talk (Space or Enter toggles)"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="btn" type="submit">Send</button>
        </div>
        <div class="sr" id="announce" aria-live="assertive"></div>
      </form>
    </section>
    <aside aria-label="Task">
      <div class="panel">
        <div><h2>Media</h2><dl><dt>Input</dt><dd>png jpeg webp gif · wav mp3 m4a ogg webm</dd><dt>Max file</dt><dd>20 MiB</dd><dt>Voice</dt><dd>speech-to-text · spoken replies</dd><dt>Images</dt><dd>generate_image on</dd></dl></div>
        <div><h2>Settings</h2><dl><dt>Model</dt><dd>gpt-6.1-sol</dd><dt>Voice</dt><dd>coral</dd></dl></div>
      </div>
    </aside>
  </main>
</div>
<dialog id="full"><div class="photo" role="img" aria-label="Living room photo, full size"></div><form method="dialog"><button class="btn ghost">Close</button></form></dialog>
<script>
(function () {
  var m = /[?&]theme=(light|dark)/.exec(location.search); if (m) document.documentElement.setAttribute('data-theme', m[1]);
  var stream = document.getElementById('stream'), chips = document.getElementById('chips');
  var pending = [], step = 0, recTimer = null, speakTimer = null;
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function wave(n) { var w = el('span', 'wave'); for (var i = 0; i < n; i++) { var b = el('i'); b.style.height = (20 + ((i * 37) % 70)) + '%'; w.appendChild(b); } return w; }
  function photo(alt, green) { var p = el('div', 'photo' + (green ? ' green' : '')); p.setAttribute('role', 'img'); p.setAttribute('aria-label', alt); p.tabIndex = 0;
    p.addEventListener('click', function () { document.getElementById('full').showModal(); }); return p; }
  function turn(role, who) { var d = el('div', 'ev ' + role); d.appendChild(el('div', 'who', who)); stream.appendChild(d); stream.scrollTop = stream.scrollHeight; return d; }
  function status(text, err) { stream.appendChild(el('div', 'status' + (err ? ' err' : ''), text)); stream.scrollTop = stream.scrollHeight; }
  function setState(s) { var p = document.getElementById('state'); p.textContent = s; p.className = 'pill' + (s === 'WORKING' ? ' working' : ''); }
  function renderChips() { chips.innerHTML = ''; pending.forEach(function (f, i) { var c = el('span', 'chip'); if (f.kind === 'image') c.appendChild(el('span', 'thumb')); else c.appendChild(wave(6));
    c.appendChild(el('span', '', f.name + ' · ' + f.size)); var x = el('button', '', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Remove ' + f.name);
    x.onclick = function () { pending.splice(i, 1); renderChips(); }; c.appendChild(x); chips.appendChild(c); }); }
  function agentReply(text, speak) { setState('WORKING'); setTimeout(function () { var d = turn('agent', 'Agent · message'); d.appendChild(document.createTextNode(text));
    if (speak && document.getElementById('spk').getAttribute('aria-pressed') === 'true') { var s = el('div', 'speaking'); s.appendChild(wave(10)); s.appendChild(el('span', '', 'Speaking…'));
      var stop = el('button', 'btn ghost', 'Stop'); stop.type = 'button'; stop.style.padding = '.1rem .5rem'; stop.onclick = function () { clearTimeout(speakTimer); s.lastChild.previousSibling.textContent = 'Stopped'; stop.remove(); }; s.appendChild(stop); d.appendChild(s);
      speakTimer = setTimeout(function () { s.lastChild.previousSibling.textContent = 'Spoken · 0:07'; stop.remove(); }, 4000); }
    setState('INPUT_REQUIRED'); stream.scrollTop = stream.scrollHeight; }, 700); }
  // seed: attach → send → reply
  var u = turn('user', 'You'); u.appendChild(photo('Living room photo: beige wall, grey sofa, framed picture')); u.appendChild(el('div', 'cap', 'living-room.jpg · 1.8 MB · 2048×1536')); u.appendChild(document.createTextNode('What would make this room feel warmer?'));
  var a = turn('agent', 'Agent · message'); a.appendChild(document.createTextNode('The grey sofa and beige wall are cool and flat. Try a warm-toned throw, a rug with rust or ochre, and a lamp at 2700 K beside the sofa.'));
  document.getElementById('attach').onclick = function () { pending.push(step % 2 ? { kind: 'audio', name: 'note.m4a', size: '0:12' } : { kind: 'image', name: 'sofa-closeup.jpg', size: '940 KB' }); step++; renderChips(); };
  document.getElementById('toolarge').onclick = function () { status('Not sent: holiday-video.webm is 48 MB; the limit is 20 MiB per file. Remove it and send again.', true); };
  document.getElementById('spk').onclick = function () { var on = this.getAttribute('aria-pressed') !== 'true'; this.setAttribute('aria-pressed', String(on)); this.title = 'Spoken replies: ' + (on ? 'on' : 'off'); };
  document.getElementById('composer').addEventListener('submit', function (e) { e.preventDefault(); var ta = document.getElementById('reply'); var t = ta.value.trim(); if (!t && !pending.length) return;
    var d = turn('user', 'You'); pending.forEach(function (f) { if (f.kind === 'image') { d.appendChild(photo('Attached photo ' + f.name)); d.appendChild(el('div', 'cap', f.name + ' · ' + f.size)); } else { var r = el('div', 'audio'); r.appendChild(wave(18)); r.appendChild(el('span', 'cap', f.name + ' · ' + f.size)); d.appendChild(r); } });
    if (t) d.appendChild(document.createTextNode(t)); pending = []; renderChips(); ta.value = '';
    agentReply('Here is a mock-up with a green sofa:', false);
    setTimeout(function () { var g = turn('agent', 'Agent · image'); g.appendChild(photo('Generated: the same room with a green sofa and a rust rug', true)); g.appendChild(el('div', 'cap', 'generated · 1024×768 · "the room with a green sofa"')); }, 1500); });
  // mic: hold (pointer) or toggle (keyboard)
  var mic = document.getElementById('mic'), rec = document.getElementById('rec'), t0 = 0;
  function startRec() { if (mic.getAttribute('aria-pressed') === 'true') return; speakTimer && clearTimeout(speakTimer); mic.setAttribute('aria-pressed', 'true'); rec.hidden = false; t0 = Date.now(); document.getElementById('announce').textContent = 'Recording';
    recTimer = setInterval(function () { var s = Math.floor((Date.now() - t0) / 1000); document.getElementById('secs').textContent = '0:' + String(s).padStart(2, '0'); document.getElementById('lvl').style.width = (25 + Math.random() * 65) + '%'; }, 120); }
  function stopRec() { if (mic.getAttribute('aria-pressed') !== 'true') return; clearInterval(recTimer); mic.setAttribute('aria-pressed', 'false'); rec.hidden = true;
    if (Date.now() - t0 < 300) { status('Nothing recorded — hold the button while you speak.'); document.getElementById('announce').textContent = 'Nothing recorded'; return; }
    document.getElementById('announce').textContent = 'Sent'; var d = turn('user', 'You · voice'); var r = el('div', 'audio'); r.appendChild(wave(22)); r.appendChild(el('span', 'cap', 'voice · 0:04')); d.appendChild(r);
    var tr = el('div', 'transcript', 'Transcribing…'); d.appendChild(tr); setState('WORKING');
    setTimeout(function () { tr.textContent = '“Would a rug work better than a throw on the sofa in the first photo?”'; agentReply('Yes — a 160 × 230 cm rug in rust under the front legs of the sofa warms the whole floor; a throw only changes the sofa.', true); }, 900); }
  mic.addEventListener('pointerdown', function (e) { e.preventDefault(); startRec(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { mic.addEventListener(ev, stopRec); });
  mic.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (mic.getAttribute('aria-pressed') === 'true') stopRec(); else startRec(); } });
  var form = document.getElementById('composer');
  form.addEventListener('dragover', function (e) { e.preventDefault(); form.classList.add('drop'); });
  form.addEventListener('dragleave', function () { form.classList.remove('drop'); });
  form.addEventListener('drop', function (e) { e.preventDefault(); form.classList.remove('drop'); document.getElementById('attach').click(); });
})();
</script>
</body>
</html>
