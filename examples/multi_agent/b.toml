# Agent b of the five-agent example (issue-36). See README.md.

[agent]
id = "b"
name = "Billing"
description = "Answers billing questions; asks the ledger agent for balances."

[temporal]
mode = "embedded"

[temporal.embedded]
# One dev server for all five agents: the same database path shares it.
database_path = "examples/multi_agent/.state/temporal.sqlite3"

[openai]
model = "gpt-6.1-sol"

[server]
base_url = "http://127.0.0.1:8090/agents/b"

[store]
sqlite_path = "examples/multi_agent/.state/b.sqlite3"

[[agents]]
id = "d"
url = "http://127.0.0.1:8090/agents/d"
