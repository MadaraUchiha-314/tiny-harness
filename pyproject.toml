[project]
name = "tiny_harness"
version = "0.1.0"
description = "A tiny agent harness"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MadaraUchiha-314" }]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "packaging>=26.3",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MadaraUchiha-314/tiny-harness"
Documentation = "https://madarauchiha-314.github.io/tiny-harness/"
Repository = "https://github.com/MadaraUchiha-314/tiny-harness"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./tiny_harness, not ./src/tiny_harness.
module-name = "tiny_harness"
module-root = ""

[dependency-groups]
dev = [
    "commitizen>=4.19",
    "pre-commit>=4",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
# Never format the locked spec documents' code blocks (docs/specs/<id>/*.md).
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN401", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# R22.2: no `Any` anywhere in tiny_harness; untyped third-party values are parsed at the boundary.
"typing.Any" = { msg = "Any is banned (requirements R22.2); parse into a typed model at the boundary" }
"typing_extensions.Any" = { msg = "Any is banned (requirements R22.2)" }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401", "TID251"]

[tool.pyright]
include = ["tiny_harness", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: needs the live environment (Temporal Cloud, OpenAI); skipped with a reason when a secret is absent",
]

[tool.commitizen]
name = "cz_conventional_commits"
# The uv provider rewrites [project] version and uv.lock in the same bump commit.
version_provider = "uv"
tag_format = "v$version"
version_scheme = "semver"
major_version_zero = true
update_changelog_on_bump = false
