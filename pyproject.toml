[project]
name = "tiny_harness"
version = "0.0.0"
description = "A tiny agent harness"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MadaraUchiha-314" }]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MadaraUchiha-314/tiny-harness"
Documentation = "https://madarauchiha-314.github.io/tiny-harness/"
Repository = "https://github.com/MadaraUchiha-314/tiny-harness"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./tiny_harness, not ./src/tiny_harness.
module-name = "tiny_harness"
module-root = ""

[dependency-groups]
dev = [
    "commitizen>=4.19",
    "pre-commit>=4",
    "pyright>=1.1.414",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.13",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["tiny_harness", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.commitizen]
name = "cz_conventional_commits"
# The uv provider rewrites [project] version and uv.lock in the same bump commit.
version_provider = "uv"
tag_format = "v$version"
version_scheme = "semver"
major_version_zero = true
update_changelog_on_bump = false
